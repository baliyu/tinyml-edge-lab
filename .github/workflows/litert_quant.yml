name: litert_quant
on:
  push:
    paths:
      - "litert_quant/**"
      - ".github/workflows/litert_quant.yml"
  pull_request:
    paths:
      - "litert_quant/**"
      - ".github/workflows/litert_quant.yml"
jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: litert_quant
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: litert_quant/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
